# Base de datos para desarrollo local.
# Uso (desde backend/):  docker compose up -d
# Requiere el archivo .env (ver .env.example).
name: potro-almacen

services:
  mysql:
    image: mysql:8.4
    container_name: potro-almacen-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-potro_almacen}
      MYSQL_USER: ${DB_USER:?Define DB_USER en backend/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en backend/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en backend/.env}
    # utf8mb4 + utf8mb4_0900_ai_ci: las fichas traen acentos, ñ y símbolos como ½, ” y µf.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
