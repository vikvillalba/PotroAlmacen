# Perfil de desarrollo local.
# Requiere la base levantada con `docker compose up -d` y el archivo backend/.env.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:potro_almacen}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

potro:
  seguridad:
    # Actor fijo mientras no exista autenticación: un almacenista del campus Obregón Náinari.
    # Los IDs deben coincidir con los registros de usuarios y org_almacen cuando existan
    # (org_almacen se crea en la HU1). Al llegar la autenticación real solo se reemplaza
    # el ActorResolver; esta sección desaparece.
    actor-fijo:
      usuario-id: 1
      rol: ALMACENISTA
      almacen-id: 1
