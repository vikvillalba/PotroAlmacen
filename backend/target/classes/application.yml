# Configuración común a todos los perfiles.
# Este archivo NO define la conexión a la base: cada perfil (dev, test) la aporta.
# Así la aplicación no arranca por accidente sin un perfil explícito.
spring:
  application:
    name: potro-almacen

  # Lee backend/.env (si existe) como fuente de propiedades. Permite usar ${DB_PASSWORD}
  # sin escribir contraseñas en el código. Es opcional: en el CI no existe.
  config:
    import: optional:file:.env[.properties]

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea y modifica Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

# Swagger y /v3/api-docs quedan apagados por defecto; el perfil dev los enciende.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
