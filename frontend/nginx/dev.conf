# Proxy de desarrollo: un solo origen (http://localhost:8000) para el frontend y la API.
#   /api/*  -> backend Spring Boot en el host (localhost:8080)
#   /*      -> servidor de desarrollo de Vite en el host (localhost:5173), con HMR
# nginx corre en Docker; host.docker.internal apunta a la máquina de desarrollo.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Permite subir archivos (fichas, fotos) sin el límite de 1 MB por defecto.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        # WebSocket de Vite para la recarga en caliente (HMR).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
    }
}
